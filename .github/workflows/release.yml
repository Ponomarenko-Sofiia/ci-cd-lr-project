name: Automated Release & Documentation

on:
  push:
    branches: [ main ]
    id-ci: false # Запобігає запуску на звичайні пуші, якщо хочеш запускати лише після PR

jobs:
  release:
    if: github.event_name == 'push' # Спрацьовує після злиття гілок у main
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch Chuck Norris Joke
        id: chuck_joke
        run: |
          JOKE=$(curl -s https://api.chucknorris.io/jokes/random | jq -r '.value')
          echo "joke=$JOKE" >> $GITHUB_OUTPUT

      - name: Determine Version
        id: versioning
        run: |
          VERSION="v1.0.${{ github.run_number }}"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update README.md
        env:
          VERSION: ${{ steps.versioning.outputs.version }}
          JOKE: ${{ steps.chuck_joke.outputs.joke }}
        run: |
          # Перевіряємо, чи є вже заголовок у README. Якщо ні — додаємо в кінець.
          if ! grep -q "## Latest Release Info" README.md; then
            echo -e "\n## Latest Release Info" >> README.md
          fi
          
          # Очищуємо старі дані релізу та записуємо нові
          sed -i '/## Latest Release Info/,$d' README.md
          echo "## Latest Release Info" >> README.md
          echo "- **Version:** ${{ env.VERSION }}" >> README.md
          echo "- **Commit Message:** ${{ github.event.head_commit.message }}" >> README.md
          echo "- **Chuck Norris Joke:** ${{ env.JOKE }}" >> README.md

      - name: Commit & Push changes to README
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: auto-update README with release info [skip ci]" || echo "No changes to commit"
          git push origin main

      - name: Create GitHub Release and Tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.version }}
          name: Release ${{ steps.versioning.outputs.version }}
          body: |
            ### Release Details
            - **Commit:** ${{ github.sha }}
            - **Joke of the Release:** ${{ steps.chuck_joke.outputs.joke }}
          token: ${{ secrets.GITHUB_TOKEN }}